name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK (timestamped copy for history + a permanent "latest" filename)
        run: |
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/household-finance-${STAMP}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/household-finance-latest.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: household-finance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish/update "latest" GitHub Release with the APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ env.STAMP }} UTC)
          body: |
            Automatically built from the latest push to main.
            Open https://github.com/${{ github.repository }}/releases/latest any time to find the newest APK.
          prerelease: false
          files: app/build/outputs/apk/debug/household-finance-*.apk
